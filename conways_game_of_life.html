<!-- 
Description: This is Conway's Game of Life, a zero player simulation game. 
Learn about it at: https://en.wikipedia.org/wiki/Conway%27s_Game_of_Life

Authors: This is a group development effort by Team 9 (Dylan O'brien, Alec Slavik,
Ted Athon, Nick Reinig, Amrit Sian, Divit Kannan)

Usage: The object of this game is to mark cells as dead or alive, and then progress through generations as a set of rules dictate the next state of the board.

Purpose: Gaming, Entertainment
-->

<!DOCTYPE html>
<html lang="en">
<head>

<style>

  button:disabled {

  /* Alec Slavik: Next button gradient (pink/red) */

  /* Alec Slavik: Play button gradient (blue/cyan) */

  }

  /* Alec Slavik: Pause button gradient (pink/yellow) */

    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
  }

  /* Divit Kannan: reset button gradient (orange/red) */
  #resetBtn {
    background: linear-gradient(135deg, #ff9a56 0%, #ff6a00 100%);
  }

  /* Alec Slavik: add color for clear button (unreaedable before)*/

    background: linear-gradient(135deg, #2e51ff 0%, #1700ad 100%);
  }	

  /* Undo/Redo buttons gradient (green/teal) */
  #undoBtn, #redoBtn {

  /* Alec Slavik: Button hover effect */
  button:hover:not(:disabled) {

  /* simple styles for the new audio controls */

  }
  #volumeSlider {

  }

  /* speed controls styling */
  #speedControls {
    margin-top: 14px;

    margin-top: 14px;

  #soundControls label {

 /*Shape List Styling. Dylan O'Brien*/
  #shapeControls {
    margin: 10px auto 0 auto;

  #shapeSelect {
    padding: 6px 10px;

  /* Grid size controls styling. Divit Kannan */
  #gridSizeControls {
    margin-top: 14px;
    display: flex;
    gap: 8px;

    justify-content: center;

  #gridSizeControls input[type="number"] {

  #gridSizeControls button {

  /*Alec Slavik 11/23: Create all color themes to go through*/
  /* Default theme (purple) */
  body.theme-purple {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

<body>

<h2 style="text-align:center;">Conway's Game of Life</h2>

<div id="stats">
  <div>Generation: <span id="genCount">0</span></div>
  <div>Population: <span id="popCount">0</span></div>
</div>

<div id="board"></div>

<!--Shape List UI. Dylan O'Brien-->
<div id="shapeControls">
  <label for="shapeSelect">Shape:</label>
  <select id="shapeSelect">
    <option value="none">None (Single Cell)</option>
    <option value="block">Block (2x2)</option>
    <option value="blinker">Blinker</option>
    <option value="glider">Glider</option>
  </select>
</div>


<div id="controls">
  <!--Alec Slavik 11/23: add theme button-->
  <button id="themeBtn">Theme</button>
  <button id="nextBtn">Next Generation</button>
  <button id="playBtn">Play</button>
  <button id="pauseBtn">Pause</button>
  <button id="clearBtn">Clear Grid</button>
  <button id="resetBtn">Reset</button>
  <button id="undoBtn">Undo</button>
  <button id="redoBtn">Redo</button>

  <!--Amrit Sian: Random mode HTML-->
  <button id="randomBtn">Randomize</button>

<div id="randomControls">
  <label for="densitySlider">Density:</label>
  <input id="densitySlider" type="range" min="0" max="100" value="30">
  <span id="densityValue">30%</span>
</div>

  <div id="speedControls">
    <label for="speedSlider">Speed</label>
    <input id="speedSlider" type="range" min="50" max="1000" value="300" step="50" />
    <span id="speedValue">300ms</span>
  </div>

  <div id="audioControls">
    <label for="volumeSlider">SFX Volume</label>
    <input id="volumeSlider" type="range" min="0" max="100" value="100" />
    <button id="muteBtn" type="button">Mute</button>
  </div>

  <!-- Ted Athon: sound selection controls -->
  <div id="soundControls">
    <span>Sound Effect:</span>
    <label>
      <input type="radio" name="sfxChoice" value="yell" checked />
      Yell
    </label>
    <label>
      <input type="radio" name="sfxChoice" value="fart" />
      Fart
    </label>
    <label>
      <input type="radio" name="sfxChoice" value="boom" />
      Boom
    </label>
    <label>
      <input type="radio" name="sfxChoice" value="tone" />
      Tone
    </label>
    <label>
      <input type="radio" name="sfxChoice" value="explode" />
      Explode
    </label>
  </div>

  <!-- Divit Kannan: Grid Size Controls -->
  <div id="gridSizeControls">
    <label for="rowsInput">Rows:</label>
    <input type="number" id="rowsInput" min="5" max="50" value="20" />
    <label for="colsInput">Cols:</label>
    <input type="number" id="colsInput" min="5" max="50" value="20" />
    <button id="applyGridBtn">Apply Grid Size</button>
    <button id="preset10Btn">10×10</button>
    <button id="preset20Btn">20×20</button>
    <button id="preset30Btn">30×30</button>
  </div>
</div>

<script>
  // Alec Slavik, static 20x20 board
  let rows = 20;
  let cols = 20;
  const board = document.getElementById("board");

  // 2D array to store state: 0 = dead, 1 = alive
  let grid = Array.from({ length: rows }, () => Array(cols).fill(0));
  let initialGrid = Array.from({ length: rows }, () => Array(cols).fill(0)); // store initial state for reset
  let intervalId = null; // for play/pause control
  let generation = 0; // track generation count
  let simulationSpeed = 300; // default speed in ms

  // Divit Kannan: Undo/Redo history management
  let history = [];
  let historyIndex = -1;
  const MAX_HISTORY = 50; 

  /*Shape definitions and selected shape. Dylan O'Brien*/
  const SHAPES = {
    none: {
      pattern: []
    },
    block: {
      // 2x2 block with the clicked cell as top left
      pattern: [
        [0, 0], [0, 1],
        [1, 0], [1, 1]
      ]
    },
    blinker: {
      // horizontal line of 3 with clicked cell in the middle
      pattern: [
        [0, -1], [0, 0], [0, 1]
      ]
    },
    glider: {
      // standard glider pattern roughly centered on clicked cell
      pattern: [
        [-1, 0],
        [0, 1],
        [1, -1], [1, 0], [1, 1]
      ]
    }
  };

 //track shape that is currently selected. Dylan O'Brien
  let selectedShapeKey = "none";


  // sound effects added by Ted Athon
  // path to the sound to play when a cell becomes alive (default sound)
  const SFX_SRC = "sounds/yell.mp3";

  // more sounds
  const SFX_PATHS = {
    yell: "sounds/yell.mp3",
    fart: "sounds/fart.mp3",
    boom: "sounds/boom.mp3",
    tone: "sounds/tone.mp3",
    explode: "sounds/explode.mp3"
  };

  // track which sound file is currently selected for playback
  let currentSfxSrc = SFX_SRC;

  let sfxVolume = 1.0;
  let sfxMuted  = false;

  // helper to play one short sound; called once per birth
  function playBirthSound() {
    // create a fresh audio element so overlapping sounds can play together
    const a = new Audio(currentSfxSrc);
    // set volume based on current slider and mute state
    a.volume = sfxMuted ? 0 : sfxVolume;
    // try to play
    a.play().catch(() => {
      // this catch is here so browsers do not complain if audio cannot start
    });
  }

  // ui for volume and mute
  (function initAudioControls(){
    const vol = document.getElementById("volumeSlider");
    const muteBtn = document.getElementById("muteBtn");

    // when the slider moves, update the volume number
    vol.addEventListener("input", () => {
      sfxVolume = Number(vol.value) / 100;
    });

    // when the mute button is clicked, toggle mute and update the label
    muteBtn.addEventListener("click", () => {
      sfxMuted = !sfxMuted;
      muteBtn.textContent = sfxMuted ? "Unmute" : "Mute";
    });
  })();

  // Ted Athon: ui for selecting which sound effect file to use
  (function initSoundSelector() {
    // grab all radio buttons that belong to the sound effect group
    const radios = document.querySelectorAll('input[name="sfxChoice"]');

    // add a change listener so when a radio is picked we update the sound path
    radios.forEach((radio) => {
      radio.addEventListener("change", () => {
        // only react when this radio is actually checked
        if (radio.checked) {
          const key = radio.value;
          // look up the file path for this sound choice
          const newSrc = SFX_PATHS[key];
          if (newSrc) {
            currentSfxSrc = newSrc;
          }
        }
      });
    });
  })();

  // ui for speed control - Divit Kannan
  (function initSpeedControls(){
    const speedSlider = document.getElementById("speedSlider");
    const speedValue = document.getElementById("speedValue");

    speedSlider.addEventListener("input", () => {
      simulationSpeed = Number(speedSlider.value);
      speedValue.textContent = simulationSpeed + "ms";
      
      // if simulation is running, restart with new speed
      if (intervalId) {
        pause();
        play();
      }
    });
  })();

  // Amrit Sian: Density slider for random mode
  (function initDensityControls() {
    const densitySlider = document.getElementById("densitySlider");
    const densityValue = document.getElementById("densityValue");

    densitySlider.addEventListener("input", () => {
      densityValue.textContent = densitySlider.value + "%";
    });
  })();

/*Shape dropdown listener. Dylan O'Brien*/
  const shapeSelect = document.getElementById("shapeSelect");
  shapeSelect.addEventListener("change", () => {
    selectedShapeKey = shapeSelect.value;
  });

  // Grid size controls. Divit Kannan
  function initGridSizeControls() {
    const rowsInput = document.getElementById("rowsInput");
    const colsInput = document.getElementById("colsInput");
    const applyBtn = document.getElementById("applyGridBtn");
    const preset10Btn = document.getElementById("preset10Btn");
    const preset20Btn = document.getElementById("preset20Btn");
    const preset30Btn = document.getElementById("preset30Btn");

    applyBtn.addEventListener("click", () => {
      const newRows = parseInt(rowsInput.value);
      const newCols = parseInt(colsInput.value);
      if (newRows >= 5 && newRows <= 50 && newCols >= 5 && newCols <= 50) {
        applyGridSize(newRows, newCols);
      } else {
        alert("Please enter values between 5 and 50 for both rows and columns.");
      }
    });

    preset10Btn.addEventListener("click", () => {
      rowsInput.value = 10;
      colsInput.value = 10;
      applyGridSize(10, 10);
    });

    preset20Btn.addEventListener("click", () => {
      rowsInput.value = 20;
      colsInput.value = 20;
      applyGridSize(20, 20);
    });

    preset30Btn.addEventListener("click", () => {
      rowsInput.value = 30;
      colsInput.value = 30;
      applyGridSize(30, 30);
    });
  }

  // Creating a new grid size from the default of 24, changes board, grid, history, reset everything
  function applyGridSize(newRows, newCols) {
    pause();
    rows = newRows;
    cols = newCols;
    grid = Array.from({ length: rows }, () => Array(cols).fill(0));
    initialGrid = Array.from({ length: rows }, () => Array(cols).fill(0));
    generation = 0;
    history = [];
    historyIndex = -1;
    board.innerHTML = '';
    const maxCellSize = 24;
    const minCellSize = 8;
    const cellSize = Math.max(minCellSize, Math.min(maxCellSize, Math.floor(480 / Math.max(rows, cols))));
    board.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    const cells = board.querySelectorAll('.cell');
    document.documentElement.style.setProperty('--cell-size', `${cellSize}px`);
    createBoard(cellSize);
    updateStats();
    updateUndoRedoButtons();
  }

  // Create board and add click toggles
  function createBoard(cellSize = 24) {
    board.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.style.width = `${cellSize}px`;
        cell.style.height = `${cellSize}px`;
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.addEventListener("click", () => toggleCell(r, c, cell));
        board.appendChild(cell);
      }
    }
  }

  // Get user input to turn dead/alive cell, sfx mods inside
  function toggleCell(r, c, element) {
    saveToHistory();
    
    if (selectedShapeKey === "none") {
      // Single cell toggle
      grid[r][c] = grid[r][c] === 0 ? 1 : 0;
      element.classList.toggle("alive");
      
      // play a sound if this click made the cell alive 
      if (grid[r][c] === 1) {
        playBirthSound();
      }
    } else {
      const shape = SHAPES[selectedShapeKey];
      if (shape && shape.pattern) {
        let soundPlayed = false;
        shape.pattern.forEach(([dr, dc]) => {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            grid[nr][nc] = 1;
            if (!soundPlayed) {
              playBirthSound();
              soundPlayed = true;
            }
          }
        });
        updateBoard();
      }
    }

    updateStats();
    saveInitialState();
  }

  //save the current state as initial state - Divit Kannan
  function saveInitialState() {
    initialGrid = grid.map(row => [...row]);
  }

  // Undo/Redo functionality - Divit Kannan
  function saveToHistory() {
    history = history.slice(0, historyIndex + 1);
    
    history.push({
      grid: grid.map(row => [...row]),
      generation: generation
    });

    if (history.length > MAX_HISTORY) {
      history.shift();
    } else {
      historyIndex++;
    }
    
    updateUndoRedoButtons();
  }

  // Undo works by removing the most recent input using the history, then setting the board
  function undo() {
    if (historyIndex > 0) {
      historyIndex--;
      const state = history[historyIndex];
      grid = state.grid.map(row => [...row]);
      generation = state.generation;
      updateBoard();
      saveInitialState();
      updateUndoRedoButtons();
    }
  }
	
  // Go to saved state in the history, send change to grid, update UI
  function redo() {
    if (historyIndex < history.length - 1) {
      historyIndex++;
      const state = history[historyIndex];
      grid = state.grid.map(row => [...row]);
      generation = state.generation;
      updateBoard();
      saveInitialState();
      updateUndoRedoButtons();
    }
  }

  // Enables or disables the undo and redo buttons based on previous/future board states in the history.
  function updateUndoRedoButtons() {
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    
    undoBtn.disabled = historyIndex <= 0;
    redoBtn.disabled = historyIndex >= history.length - 1;
  }

  // Count alive neighbors - Created by Nick Reinig
  function countNeighbors(r, c) {
    let count = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          count += grid[nr][nc];
        }
      }
    }
    return count;
  }

  // Compute next generation - Created by Nick Reinig
  function nextGeneration() {
    const newGrid = Array.from({ length: rows }, () => Array(cols).fill(0)); // create new grid that will replace the current grid

    // collect all cells that are born this step so we can play one sound per birth
    const births = [];
	
    // Apply rules to new grid based on state of current grid
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const neighbors = countNeighbors(r, c);

        // Conway's rules
        if (grid[r][c] === 1 && (neighbors === 2 || neighbors === 3)) {
          newGrid[r][c] = 1; // stays alive -- Created by Ted Athon
        } else if (grid[r][c] === 0 && neighbors === 3) {
          newGrid[r][c] = 1; // reproduction -- Created by Amrit Sian
        } else {
          newGrid[r][c] = 0; // dies or stays dead -- rules by Dylan O'Brien and Divit Kannan -- Combined into one by Nick Reinig
        }
		// If a grid was dead and now alive, we need to push that change
        if (grid[r][c] === 0 && newGrid[r][c] === 1) {
          births.push([r, c]);
        }
      }
    }

	//replace the grid with the new grid, then update the board
    grid = newGrid;
    generation++; //update generation by Nick Reinig
    updateBoard();

    // after the board updates, play one sound per birth
    if (!sfxMuted && sfxVolume > 0) {
      for (let i = 0; i < births.length; i++) {
        playBirthSound();
      }
    }
  }

  // Update visuals - Created by Nick Reinig
  function updateBoard() {
    const cells = document.querySelectorAll(".cell");
    cells.forEach(cell => {
      const r = parseInt(cell.dataset.row);
      const c = parseInt(cell.dataset.col);
      cell.classList.toggle("alive", grid[r][c] === 1);
    });
    updateStats();
  }

  // Update stats display - Created by Nick Reinig
  function updateStats() {
    const population = grid.flat().reduce((sum, cell) => sum + cell, 0);
    document.getElementById("genCount").textContent = generation;
    document.getElementById("popCount").textContent = population;
  }

  // Control functions - Created by Nick Reinig
  function play() {
    if (!intervalId) {
      intervalId = setInterval(nextGeneration, simulationSpeed); // uses current simulation speed
    }
  }
	
  // Pause works by stopping the simulation, and keeping the speed as null
  function pause() {
    clearInterval(intervalId);
    intervalId = null;
  }

  // Clear grid sets all the cells to 0, and resets the counter, updates the board, and saves this blank stage for resetting purposes
  function clearGrid() {
	saveToHistory();
	for (let r=0; r<rows; r++){
		for (let c=0; c<cols; c++){
			grid[r][c]=0;
		}
	}
	generation = 0;
	updateBoard();
	saveInitialState();
  }

  // Amrit Sian: Randomize grid function
  function randomizeGrid() {
    const wasRunning = intervalId !== null;
    pause();

    saveToHistory();

    const density = Number(document.getElementById("densitySlider").value) / 100;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        grid[r][c] = Math.random() < density ? 1 : 0;
      }
    }

    generation = 0;
    updateBoard();
    saveInitialState();

    if (wasRunning) play();
  }

  // Reset simulation goes back to the input before hitting start, and pauses the game for a new sim
  function resetSimulation() {
    pause();
    grid = initialGrid.map(row => [...row]);
    generation = 0;
    updateBoard();
  }

  // Hook up buttons - Created by Nick Reinig
  document.getElementById("nextBtn").addEventListener("click", nextGeneration);
  document.getElementById("playBtn").addEventListener("click", play);
  document.getElementById("pauseBtn").addEventListener("click", pause);
  document.getElementById("clearBtn").addEventListener("click", clearGrid);
  document.getElementById("resetBtn").addEventListener("click", resetSimulation);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  document.getElementById("randomBtn").addEventListener("click", randomizeGrid);

  // Alec Slavik: Theme toggle button 11/23
  const themes = ["theme-purple", "theme-red", "theme-blue", "theme-black"];
  let themeIndex = 0; // start at purple
  document.body.classList.add(themes[themeIndex]);

  const themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", () => {
  // remove current theme
  document.body.classList.remove(themes[themeIndex]);
  // load next
  themeIndex = (themeIndex + 1) % themes.length;
  document.body.classList.add(themes[themeIndex]);
  });
  
  initGridSizeControls();
	
  const initialCellSize = 24;
  board.style.gridTemplateColumns = `repeat(${cols}, ${initialCellSize}px)`;
  createBoard(initialCellSize);
  updateUndoRedoButtons();
</script>
